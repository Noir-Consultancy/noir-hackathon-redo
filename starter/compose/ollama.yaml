# OPTIONAL: Ollama in a container. Running Ollama natively is recommended on all
# platforms (simpler, and uses the GPU without extra setup). Use this only to make the
# whole stack start with one `compose up`, e.g. on a machine without Ollama or in CI.
# On macOS, containers get no GPU – always run Ollama natively there and point services
# at http://host.containers.internal:11434/v1 (Podman) or
# http://host.docker.internal:11434/v1 (Docker).
#
# Standalone: podman compose -f starter/compose/ollama.yaml up -d
# Pull a model: podman compose -f starter/compose/ollama.yaml exec ollama ollama pull qwen3.5:9b
#
# LLM_BASE_URL:
#   from the host:            http://localhost:11435/v1  (11435 avoids clashing with a native Ollama)
#   from other containers:    http://ollama:11434/v1

services:
  ollama:
    image: docker.io/ollama/ollama:0.35.1
    ports:
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama
    # NVIDIA GPU on Linux (requires the NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama-data:
