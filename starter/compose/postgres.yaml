# PostgreSQL 18 with the pgvector extension.
# Standalone: podman compose -f starter/compose/postgres.yaml up -d
#
# Connection string:
#   from the host:            postgresql://app:app@localhost:5432/app
#   from other containers:    postgresql://app:app@postgres:5432/app
# Enable vectors once per database: CREATE EXTENSION IF NOT EXISTS vector;
# Optional: put *.sql files in db/init/ (relative to compose.yaml) and uncomment
# the init mount below to run them on first start.

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      # Postgres 18 images store data under /var/lib/postgresql/<version>/.
      - postgres-data:/var/lib/postgresql
      # - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
