# Quests, one per mentor. criteria is server-side only (used by the judge). Owner: package 4.
- id: q-ada-1
  mentor_id: ada
  title: Granska agentens kod
  task: Förklara tre saker du alltid kollar när en kodagent har skrivit en ändring åt dig.
  kind: explain
  xp: 50
  card_id: c-review-ai-code
  criteria: >
    Godkänt om svaret nämner minst två av: att tester täcker ändringen, att scope hålls
    (inga orelaterade ändringar), följer projektets konventioner, säkerhet/hemligheter,
    att man själv förstår koden.
- id: q-karl-1
  mentor_id: karl
  title: Det överfulla kontextfönstret
  task: >
    Din agent börjar glömma instruktioner i långa sessioner. Förklara varför det händer
    och föreslå två sätt att lösa det.
  kind: solve
  xp: 50
  card_id: c-context-window
  criteria: >
    Godkänt om svaret förklarar att kontextfönstret är begränsat (äldre innehåll trängs
    undan eller får mindre vikt) och föreslår minst ett rimligt sätt, t.ex.
    sammanfattning/kompaktering, ny session, kortare kontext, instruktioner i en fil som
    AGENTS.md, eller att dela upp uppgiften.
- id: q-vera-1
  mentor_id: vera
  title: RAG eller inte RAG?
  task: >
    Ett team vill att en chattbot ska svara på frågor om deras interna wiki med 500 sidor.
    Ett annat vill att den ska räkna ut kvartalets fakturering. Vilket passar RAG, och varför?
  kind: choose
  xp: 50
  card_id: c-when-rag
  criteria: >
    Godkänt om svaret väljer wikin för RAG (hämta relevanta textstycken som kontext) och
    förklarar att fakturering är beräkning/strukturerad data som passar bättre med
    SQL eller verktygsanrop än RAG.
- id: q-oracle-1
  mentor_id: orakelbotten
  title: Fånga orakelns hallucinationer
  task: >
    Orakelbotten håller en föreläsning, men några av påståendena är fel. Kryssa i de
    påståenden som är fel.
  kind: boss
  xp: 150
  card_id: c-review-ai-answers
  statements:
    - Kontextfönstret är begränsat, så i långa sessioner kan tidiga instruktioner tappa genomslag.
    - Sätter du temperaturen till 0 kan modellen inte hallucinera, eftersom svaren då alltid blir faktamässigt korrekta.
    - Embeddings placerar texter med liknande betydelse nära varandra, så vektorsök kan hitta rätt stycke även när orden skiljer sig.
    - Med RAG tränas modellen om på era dokument, så kunskapen finns kvar i modellens vikter efter svaret.
    - När en kodagent har ändrat kod bör du granska diffen och köra testerna innan du committar, precis som med en kollegas PR.
  # Server-only: which statements are wrong (0-based) and why each one is right or wrong,
  # shown to the player only after a correct answer.
  wrong_statements: [1, 3]
  explanations:
    - >
      Modellen ser bara ett begränsat antal tokens. När sessionen växer trängs äldre
      innehåll undan eller får mindre vikt, så viktiga instruktioner bör ligga i en fil
      som AGENTS.md och sessioner hållas fokuserade.
    - >
      Temperatur styr hur slumpmässigt nästa token väljs. Temperatur 0 gör svaren mer
      förutsägbara och upprepbara, men inte sannare: modellen väljer bara det mest
      sannolika svaret, och det kan vara en hallucination som den nu ger varje gång.
    - >
      En embedding är en vektor som fångar textens betydelse. Liknande betydelse ger
      närliggande vektorer, så "avsluta prenumeration" kan hitta stycket om "säga upp
      abonnemang" fast inga ord är gemensamma.
    - >
      RAG ändrar inte modellen. Vid varje fråga hämtas relevanta textstycken och läggs i
      prompten som kontext. Vikterna är oförändrade, och nästa fråga utan hämtning vet
      inget om dokumenten. Att lära in kunskap i vikterna kallas finjustering, och det är
      sällan rätt verktyg för att ge modellen fakta.
    - >
      En kodagent kan skriva kod som ser rimlig ut men är fel, eller ändra mer än du bad
      om. Granska diffen och kör testerna som med en kollegas PR, eftersom du ansvarar för
      det du committar.
