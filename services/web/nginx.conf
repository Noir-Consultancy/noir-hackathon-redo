# Template: the image fills in ${NGINX_LOCAL_RESOLVERS} (the container's DNS) at startup.
server {
    listen 8000;
    # Look up "api" per request, so a restarted api container (new IP) is found again.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    root /usr/share/nginx/html;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Same as the Vite dev proxy: /api/* -> api service.
    location /api/ {
        set $api_upstream api:8001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
