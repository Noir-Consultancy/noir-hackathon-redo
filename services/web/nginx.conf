server {
    listen 8000;
    root /usr/share/nginx/html;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Same as the Vite dev proxy: /api/* -> api service.
    location /api/ {
        proxy_pass http://api:8001/;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
